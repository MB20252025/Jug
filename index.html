<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jug · Adjustable Measurements</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background: #2b2520;
            background-image: radial-gradient(circle at 20% 30%, #3f352e 5%, #1f1a15 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: rgba(30, 25, 20, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 40px 40px 30px 30px;
            padding: 25px 30px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #b48d64;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 700px;
            width: 100%;
        }
        h1 { font-weight: 400; color: #fad7a8; text-shadow: 0 2px 8px #2d1f13; font-size: 2rem; letter-spacing: 1px; margin-bottom: 6px; }
        .sub { color: #dbbc93; background: #1f1a15b8; padding: 4px 22px; border-radius: 40px; border: 1px solid #b48d64; font-size: 1rem; margin-bottom: 16px; }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 60vh;
            border-radius: 20px;
            background: #1e1813;
            box-shadow: inset 0 0 30px #0a0705, 0 8px 20px black;
            border: 2px solid #b48d64;
            touch-action: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 8px;
        }
        button {
            padding: 8px 28px;
            font-size: 1rem;
            font-weight: 600;
            background: #4f3a28;
            border: 2px solid #cbab82;
            color: #f7e9d3;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 3px 0 #2b1d12;
            letter-spacing: 0.5px;
            flex: 1 1 auto;
            min-width: 110px;
        }
        button:hover { background: #73583e; border-color: #f5cf9e; transform: translateY(-2px); box-shadow: 0 5px 0 #2b1d12; }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2b1d12; }
        .status { font-size: 1.1rem; background: #1f1a15b8; padding: 4px 24px; border-radius: 30px; border: 1px solid #b48d64; color: #f0dcc0; margin-top: 6px; }
        .note { font-style: italic; color: #cfa97c; font-size: 0.7rem; margin-top: 6px; opacity: 0.7; }
        @media (max-width: 480px) {
            .card { padding: 15px; }
            h1 { font-size: 1.6rem; }
            button { min-width: 80px; padding: 6px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>☕ The Coffee Jug</h1>
    <div class="sub">smaller, cleaner markings</div>

    <canvas id="jugCanvas"></canvas>

    <div class="controls">
        <button id="fillBtn">⬆ Fill</button>
        <button id="pourBtn">⬇ Pour</button>
        <button id="resetBtn">⟲ Reset</button>
    </div>

    <div class="status" id="statusDisplay">Level: 0%</div>
    <div class="note" id="debugNote">loading image…</div>
</div>

<script>
(function() {
    // ─── CONFIG ──────────────────────────────────────────────────────
    const IMAGE_PATH = 'jug.png';
    const ANIMATION_DURATION = 800;
    const MAX_LEVEL = 0.85;
    const MAX_LITERS = 10;

    // ─── MEASUREMENT STYLE (tweak these to resize) ──────────────────
    const MEASUREMENT_FONT_SIZE = 0.018;    // ← smaller = smaller text
    const MEASUREMENT_TICK_HALF = 16;       // ← shorter ticks
    const MEASUREMENT_TEXT_OFFSET = -14;    // ← moves text closer/further
    const MEASUREMENT_TICK_WIDTH = 1.5;     // ← thinner ticks

    // ─── DOM ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('jugCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('statusDisplay');
    const debugEl = document.getElementById('debugNote');

    // ─── STATE ──────────────────────────────────────────────────────
    let currentLevel = 0;
    let isAnimating = false;
    let isPouring = false;
    let img = null;
    let interiorMask = null;
    let maskReady = false;
    let useFallback = false;

    // ─── FALLBACK JUG ──────────────────────────────────────────────
    function drawFallbackJug(w, h) {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#1e1813';
        ctx.fillRect(0, 0, w, h);

        ctx.beginPath();
        ctx.moveTo(w*0.25, h*0.1);
        ctx.quadraticCurveTo(w*0.1, h*0.3, w*0.1, h*0.5);
        ctx.quadraticCurveTo(w*0.1, h*0.8, w*0.25, h*0.9);
        ctx.quadraticCurveTo(w*0.5, h*0.95, w*0.75, h*0.9);
        ctx.quadraticCurveTo(w*0.9, h*0.8, w*0.9, h*0.5);
        ctx.quadraticCurveTo(w*0.9, h*0.3, w*0.75, h*0.1);
        ctx.closePath();
        ctx.fillStyle = '#b48b62';
        ctx.fill();
        ctx.strokeStyle = '#5a3f2a';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(w*0.82, h*0.25);
        ctx.quadraticCurveTo(w*1.02, h*0.3, w*0.94, h*0.6);
        ctx.quadraticCurveTo(w*0.82, h*0.7, w*0.78, h*0.5);
        ctx.strokeStyle = '#5a3f2a';
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(w*0.18, h*0.15);
        ctx.lineTo(w*0.06, h*0.04);
        ctx.lineTo(w*0.22, h*0.08);
        ctx.fillStyle = '#b48b62';
        ctx.fill();
        ctx.strokeStyle = '#5a3f2a';
        ctx.lineWidth = 3;
        ctx.stroke();

        const imageData = ctx.getImageData(0, 0, w, h);
        const data = imageData.data;
        const mask = new Uint8Array(w * h);
        for (let i = 0; i < data.length; i += 4) {
            const idx = i / 4;
            mask[idx] = (data[i + 3] < 128) ? 1 : 0;
        }
        return mask;
    }

    // ─── MASK FROM IMAGE ─────────────────────────────────────────────
    function computeInteriorMaskFromAlpha(imageData, w, h) {
        const data = imageData.data;
        const mask = new Uint8Array(w * h);
        for (let i = 0; i < data.length; i += 4) {
            const idx = i / 4;
            mask[idx] = (data[i + 3] < 128) ? 1 : 0;
        }
        return mask;
    }

    // ─── LOAD IMAGE ──────────────────────────────────────────────────
    function initCanvas() {
        img = new Image();
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            canvas.style.aspectRatio = img.width / img.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            interiorMask = computeInteriorMaskFromAlpha(imageData, canvas.width, canvas.height);
            maskReady = true;
            useFallback = false;
            debugEl.textContent = '✅ Image loaded.';
            currentLevel = 0;
            isPouring = false;
            drawScene();
        };
        img.onerror = function() {
            debugEl.textContent = '❌ Failed to load "' + IMAGE_PATH + '". Using fallback.';
            console.warn('Image not found:', IMAGE_PATH);
            useFallback = true;
            canvas.width = 400;
            canvas.height = 500;
            canvas.style.aspectRatio = '0.8';
            interiorMask = drawFallbackJug(canvas.width, canvas.height);
            maskReady = true;
            currentLevel = 0;
            isPouring = false;
            drawScene();
        };
        img.src = IMAGE_PATH;
    }

    // ─── DRAW ─────────────────────────────────────────────────────────
    function drawScene(level = currentLevel, pouring = isPouring) {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        if (!maskReady) return;

        if (useFallback) {
            interiorMask = drawFallbackJug(w, h);
        } else {
            ctx.drawImage(img, 0, 0, w, h);
        }

        const liquidHeight = level * h;
        if (liquidHeight > 0) {
            const grad = ctx.createLinearGradient(0, h - liquidHeight, 0, h);
            grad.addColorStop(0, '#8b5d37');
            grad.addColorStop(0.4, '#6b3e1f');
            grad.addColorStop(0.8, '#4d2c15');
            grad.addColorStop(1, '#2f1a0c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, h - liquidHeight, w, liquidHeight);

            const highlightY = h - liquidHeight;
            ctx.beginPath();
            ctx.ellipse(w * 0.3, highlightY + 2, w * 0.25, 4, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 220, 170, 0.25)';
            ctx.fill();

            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const px = (i / 4) % w;
                const py = Math.floor((i / 4) / w);
                const maskIdx = py * w + px;
                if (interiorMask[maskIdx] === 0) {
                    data[i + 3] = 0;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        if (useFallback) {
            interiorMask = drawFallbackJug(w, h);
        } else {
            ctx.drawImage(img, 0, 0, w, h);
        }

        // Glass effect
        const glassGrad = ctx.createLinearGradient(0, 0, w * 0.3, 0);
        glassGrad.addColorStop(0, 'rgba(255,255,255,0.08)');
        glassGrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glassGrad;
        ctx.fillRect(0, 0, w, h);

        // ─── Draw measurements (using new style config) ──────────────
        drawMeasurements(w, h);

        const percent = Math.round((level / MAX_LEVEL) * 100);
        statusEl.textContent = `Level: ${Math.min(percent, 100)}%`;
    }

    // ─── MEASUREMENTS (with adjustable size) ──────────────────────
    function drawMeasurements(w, h) {
        const numLines = MAX_LITERS;
        const xPos = w * 0.5;

        ctx.save();
        // Use the configurable font size
        ctx.font = `bold ${Math.max(12, w * MEASUREMENT_FONT_SIZE)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 6;

        for (let L = 1; L <= numLines; L++) {
            const fraction = (L / numLines) * MAX_LEVEL;
            const y = h - fraction * h;

            // Tick – using MEASUREMENT_TICK_HALF and MEASUREMENT_TICK_WIDTH
            ctx.beginPath();
            ctx.moveTo(xPos - MEASUREMENT_TICK_HALF, y);
            ctx.lineTo(xPos + MEASUREMENT_TICK_HALF, y);
            ctx.strokeStyle = 'rgba(255, 240, 220, 0.5)';
            ctx.lineWidth = MEASUREMENT_TICK_WIDTH;
            ctx.stroke();

            // Label – using MEASUREMENT_TEXT_OFFSET
            ctx.fillStyle = 'rgba(255, 240, 220, 0.8)';
            ctx.fillText(L + 'L', xPos, y + MEASUREMENT_TEXT_OFFSET);
        }
        ctx.restore();
    }

    // ─── ANIMATION ──────────────────────────────────────────────────
    function animateTo(target, callback) {
        if (isAnimating) return;
        const start = currentLevel;
        const end = Math.min(Math.max(target, 0), MAX_LEVEL);
        if (Math.abs(start - end) < 0.001) {
            currentLevel = end;
            drawScene();
            if (callback) callback();
            return;
        }

        isAnimating = true;
        const startTime = performance.now();

        function step(time) {
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / ANIMATION_DURATION, 1);
            const eased = progress < 0.5
                ? 4 * progress * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 3) / 2;
            currentLevel = start + (end - start) * eased;
            drawScene(currentLevel, isPouring);

            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                currentLevel = end;
                isAnimating = false;
                drawScene(currentLevel, isPouring);
                if (callback) callback();
            }
        }
        requestAnimationFrame(step);
    }

    // ─── ACTIONS ────────────────────────────────────────────────────
    function fillCoffee() {
        if (isAnimating || currentLevel >= MAX_LEVEL - 0.01) return;
        isPouring = false;
        animateTo(MAX_LEVEL);
    }

    function pourCoffee() {
        if (isAnimating || currentLevel < 0.02) return;
        isPouring = true;
        animateTo(0, function() {
            isPouring = false;
            drawScene(0, false);
        });
    }

    function resetJug() {
        if (isAnimating) return;
        isPouring = false;
        currentLevel = 0;
        drawScene(0, false);
    }

    // ─── WIRING ──────────────────────────────────────────────────────
    document.getElementById('fillBtn').addEventListener('click', fillCoffee);
    document.getElementById('pourBtn').addEventListener('click', pourCoffee);
    document.getElementById('resetBtn').addEventListener('click', resetJug);

    window.addEventListener('resize', function() {
        if (maskReady) drawScene(currentLevel, isPouring);
    });

    initCanvas();
})();
</script>
</body>
</html>
