<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Coffee Puzzle · Breakroom</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background: #2b2520;
            background-image: radial-gradient(circle at 20% 30%, #3f352e 5%, #1f1a15 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: rgba(30, 25, 20, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 40px 40px 30px 30px;
            padding: 25px 30px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #b48d64;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 950px;
            width: 100%;
        }
        h1 {
            font-weight: 400;
            color: #fad7a8;
            text-shadow: 0 2px 8px #2d1f13;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .sub {
            color: #dbbc93;
            background: #1f1a15b8;
            padding: 4px 22px;
            border-radius: 40px;
            border: 1px solid #b48d64;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .info {
            font-size: 0.9rem;
            background: #1f2a2f;
            padding: 4px 18px;
            border-radius: 30px;
            border: 1px solid #b59268;
            margin-bottom: 16px;
            color: #dbbc93;
        }

        .container-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            flex-wrap: wrap;
            width: 100%;
            margin-bottom: 12px;
        }
        .container-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            padding: 0 4px;
            position: relative;
        }
        .container-item:hover {
            transform: scale(1.02);
        }
        .container-item.selected {
            transform: translateY(-8px);
            filter: drop-shadow(0 0 16px #fdb657);
        }
        .container-item canvas {
            border-radius: 12px 12px 8px 8px;
            border: 2px solid rgba(230, 210, 180, 0.5);
            background: #1e1813;
            box-shadow: inset 0 0 20px #0a0705, 0 8px 16px rgba(0,0,0,0.7);
            width: 100%;
            height: auto;
            max-height: 55vh;
            touch-action: none;
            display: block;
        }
        .container-label {
            margin-top: 10px;
            font-size: 1rem;
            background: #2b231d;
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid #b6976f;
            color: #fadbbc;
            box-shadow: inset 0 1px 3px #3d2c1b;
            white-space: nowrap;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 8px 0 4px;
        }
        button {
            padding: 8px 28px;
            font-size: 1rem;
            font-weight: 600;
            background: #4f3a28;
            border: 2px solid #cbab82;
            color: #f7e9d3;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 3px 0 #2b1d12;
            letter-spacing: 0.5px;
            flex: 1 1 auto;
            min-width: 110px;
        }
        button:hover { background: #73583e; border-color: #f5cf9e; transform: translateY(-2px); box-shadow: 0 5px 0 #2b1d12; }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2b1d12; }
        .status {
            font-size: 1.1rem;
            background: #1f1a15b8;
            padding: 4px 24px;
            border-radius: 30px;
            border: 1px solid #b48d64;
            color: #f0dcc0;
            margin-top: 6px;
        }
        .note {
            font-style: italic;
            color: #cfa97c;
            font-size: 0.7rem;
            margin-top: 6px;
            opacity: 0.7;
        }
        @media (max-width: 650px) {
            .container-row { gap: 15px; }
            .container-item canvas { max-height: 30vh; }
            button { min-width: 70px; padding: 6px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>☕ The Coffee Puzzle</h1>
    <div class="sub">8L in the 10L Jug</div>
    <div class="info">Tap, then tap another (target is the green line)</div>

    <div class="container-row" id="containerRow">
        <!-- 6L cup -->
        <div class="container-item" data-index="0">
            <canvas id="canvas6" width="200" height="320"></canvas>
            <div class="container-label">6L Cup</div>
        </div>
        <!-- 5L cup -->
        <div class="container-item" data-index="1">
            <canvas id="canvas5" width="200" height="300"></canvas>
            <div class="container-label">5L Cup</div>
        </div>
        <!-- 10L jug -->
        <div class="container-item" data-index="2">
            <canvas id="canvas10" width="240" height="400"></canvas>
            <div class="container-label">10L Jug</div>
        </div>
    </div>

    <div class="controls">
        <button id="resetBtn">⟲ Fresh Coffee</button>
    </div>

    <div class="status" id="statusDisplay">Levels: 6L / 5L / 0L</div>
    <div class="note" id="debugNote">— Breakroom Edition —</div>
</div>

<script>
(function() {
    // ─── PUZZLE CONFIG ──────────────────────────────────────────────
    const IMAGES = ['6l.png', '5l.png', 'jug.png'];
    const CAPACITIES = [6, 5, 10];
    const INITIAL_VOLUMES = [6, 5, 0];    // cups full, jug empty
    const TARGET_INDEX = 2;              // 10L jug
    const TARGET_VOLUME = 8;             // 8L

    // measurement style per container
    const MEASURE_CONFIGS = [
        { maxLevel: 0.85, fontSize: 0.022, tickHalf: 14, textOffset: -12, tickWidth: 1.5 }, // 6L
        { maxLevel: 0.85, fontSize: 0.022, tickHalf: 14, textOffset: -12, tickWidth: 1.5 }, // 5L
        { maxLevel: 0.75, fontSize: 0.018, tickHalf: 16, textOffset: -14, tickWidth: 1.5 }  // 10L
    ];

    const ANIMATION_DURATION = 600;

    // ─── DOM ──────────────────────────────────────────────────────────
    const canvases = [
        document.getElementById('canvas6'),
        document.getElementById('canvas5'),
        document.getElementById('canvas10')
    ];
    const containerItems = document.querySelectorAll('.container-item');
    const statusEl = document.getElementById('statusDisplay');
    const debugEl = document.getElementById('debugNote');

    // ─── STATE ──────────────────────────────────────────────────────
    let volumes = [...INITIAL_VOLUMES];
    let selectedIndex = null;
    let isAnimating = false;
    let animationQueue = [];
    let winTriggered = false;   // prevent multiple alerts

    const containers = [];

    // ─── FLOOD‑FILL MASK ─────────────────────────────────────────────
    function computeInteriorMask(imageData, w, h) {
        const data = imageData.data;
        const mask = new Uint8Array(w * h);

        let seedX = Math.floor(w / 2);
        let seedY = Math.floor(h / 2);
        let found = false;
        const searchRadius = Math.min(w, h) * 0.3;

        for (let r = 0; r < searchRadius && !found; r += 2) {
            for (let angle = 0; angle < Math.PI * 2 && !found; angle += 0.2) {
                const px = Math.floor(w / 2 + r * Math.cos(angle));
                const py = Math.floor(h / 2 + r * Math.sin(angle));
                if (px < 0 || px >= w || py < 0 || py >= h) continue;
                const idx = (py * w + px) * 4;
                if (data[idx + 3] < 128) {
                    seedX = px;
                    seedY = py;
                    found = true;
                }
            }
        }

        if (!found) {
            for (let i = 0; i < mask.length; i++) mask[i] = 1;
            return mask;
        }

        const queue = [];
        const visited = new Uint8Array(w * h);
        const startIdx = seedY * w + seedX;
        queue.push(seedX, seedY);
        visited[startIdx] = 1;

        while (queue.length > 0) {
            const cx = queue.shift();
            const cy = queue.shift();
            const idx = cy * w + cx;
            mask[idx] = 1;

            const neighbors = [
                [cx - 1, cy], [cx + 1, cy], [cx, cy - 1], [cx, cy + 1]
            ];
            for (let n of neighbors) {
                const nx = n[0];
                const ny = n[1];
                if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
                const nIdx = ny * w + nx;
                if (visited[nIdx]) continue;
                const alpha = data[(nIdx) * 4 + 3];
                if (alpha < 128) {
                    visited[nIdx] = 1;
                    queue.push(nx, ny);
                }
            }
        }

        const interiorCount = mask.reduce((a, b) => a + b, 0);
        if (interiorCount === 0) {
            for (let i = 0; i < mask.length; i++) mask[i] = 1;
        }
        return mask;
    }

    // ─── LOAD IMAGES ──────────────────────────────────────────────────
    function loadContainer(index) {
        const canvas = canvases[index];
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const container = {
            canvas,
            ctx,
            img,
            mask: null,
            maskReady: false,
            width: canvas.width,
            height: canvas.height,
            loaded: false
        };
        containers[index] = container;

        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            container.width = img.width;
            container.height = img.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            container.mask = computeInteriorMask(imageData, canvas.width, canvas.height);
            container.maskReady = true;
            container.loaded = true;
            drawAll();
        };
        img.onerror = function() {
            debugEl.textContent = '❌ Failed to load ' + IMAGES[index] + '. Using fallback.';
            console.warn('Image not found:', IMAGES[index]);
            canvas.width = 200;
            canvas.height = 300;
            container.width = 200;
            container.height = 300;
            ctx.fillStyle = '#b48b62';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#5a3f2a';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
            const mask = new Uint8Array(canvas.width * canvas.height);
            for (let i = 0; i < mask.length; i++) mask[i] = 1;
            container.mask = mask;
            container.maskReady = true;
            container.loaded = true;
            drawAll();
        };
        img.src = IMAGES[index];
    }

    // ─── DRAW CONTAINER ──────────────────────────────────────────────
    function drawContainer(index) {
        const container = containers[index];
        if (!container || !container.loaded || !container.maskReady) return;
        const { canvas, ctx, img, mask, width: w, height: h } = container;
        const maxLiters = CAPACITIES[index];
        const config = MEASURE_CONFIGS[index];
        const maxLevel = config.maxLevel;

        const frac = volumes[index] / maxLiters;
        const effectiveFrac = Math.min(frac, 1);
        const liquidHeight = effectiveFrac * maxLevel * h;

        ctx.clearRect(0, 0, w, h);

        // 1. Draw container image
        ctx.drawImage(img, 0, 0, w, h);

        // 2. Draw coffee
        if (liquidHeight > 0) {
            const grad = ctx.createLinearGradient(0, h - liquidHeight, 0, h);
            grad.addColorStop(0, '#8b5d37');
            grad.addColorStop(0.4, '#6b3e1f');
            grad.addColorStop(0.8, '#4d2c15');
            grad.addColorStop(1, '#2f1a0c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, h - liquidHeight, w, liquidHeight);

            const highlightY = h - liquidHeight;
            ctx.beginPath();
            ctx.ellipse(w * 0.3, highlightY + 2, w * 0.25, 4, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 220, 170, 0.25)';
            ctx.fill();

            // Mask
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const px = (i / 4) % w;
                const py = Math.floor((i / 4) / w);
                const maskIdx = py * w + px;
                if (mask[maskIdx] === 0) {
                    data[i + 3] = 0;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // 3. Redraw image on top
        ctx.drawImage(img, 0, 0, w, h);

        // 4. Glass reflection
        const glassGrad = ctx.createLinearGradient(0, 0, w * 0.3, 0);
        glassGrad.addColorStop(0, 'rgba(255,255,255,0.08)');
        glassGrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glassGrad;
        ctx.fillRect(0, 0, w, h);

        // 5. Measurements
        drawMeasurements(index);

        updateStatus();
    }

    // ─── MEASUREMENTS + TARGET LINE ──────────────────────────────────
    function drawMeasurements(index) {
        const container = containers[index];
        if (!container || !container.loaded) return;
        const { canvas, ctx, width: w, height: h } = container;
        const maxLiters = CAPACITIES[index];
        const config = MEASURE_CONFIGS[index];
        const xPos = w * 0.5;

        ctx.save();
        ctx.font = `bold ${Math.max(12, w * config.fontSize)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 6;

        // Draw regular measurement lines
        for (let L = 1; L <= maxLiters; L++) {
            const fraction = (L / maxLiters) * config.maxLevel;
            const y = h - fraction * h;

            ctx.beginPath();
            ctx.moveTo(xPos - config.tickHalf, y);
            ctx.lineTo(xPos + config.tickHalf, y);
            ctx.strokeStyle = 'rgba(255, 240, 220, 0.5)';
            ctx.lineWidth = config.tickWidth;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 240, 220, 0.8)';
            ctx.fillText(L + 'L', xPos, y + config.textOffset);
        }

        // ─── TARGET LINE (8L on the 10L jug) ─────────────────────────
        if (index === TARGET_INDEX) {
            const targetFrac = (TARGET_VOLUME / maxLiters) * config.maxLevel;
            const targetY = h - targetFrac * h;

            // Glowing green line
            ctx.shadowColor = 'rgba(46, 204, 113, 0.6)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(xPos - config.tickHalf - 6, targetY);
            ctx.lineTo(xPos + config.tickHalf + 6, targetY);
            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            // 🎯 Target label
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#2ecc71';
            ctx.font = `bold ${Math.max(14, w * config.fontSize * 1.2)}px Arial`;
            ctx.fillText('🎯 8L', xPos, targetY - 20);
            ctx.shadowBlur = 0;
        }

        ctx.restore();
    }

    // ─── UPDATE STATUS ──────────────────────────────────────────────
    function updateStatus() {
        const vals = volumes.map((v, i) => v.toFixed(1) + 'L');
        statusEl.textContent = `Levels: ${vals[0]} / ${vals[1]} / ${vals[2]}`;
    }

    // ─── DRAW ALL ────────────────────────────────────────────────────
    function drawAll() {
        for (let i = 0; i < containers.length; i++) {
            if (containers[i] && containers[i].loaded) {
                drawContainer(i);
            }
        }
        containerItems.forEach((el, idx) => {
            el.classList.toggle('selected', idx === selectedIndex);
        });
    }

    // ─── WIN DETECTION ──────────────────────────────────────────────
    function checkWin() {
        if (winTriggered) return;
        // Use exact match with tolerance for floating point
        if (Math.abs(volumes[TARGET_INDEX] - TARGET_VOLUME) < 0.001) {
            winTriggered = true;
            setTimeout(() => {
                alert("☕ 8L! Target reached, officer.");
                // You could also add confetti or a canvas overlay here
                winTriggered = false; // allow re-triggering after reset
            }, 100);
        }
    }

    // ─── POUR LOGIC (exact puzzle rules) ────────────────────────────
    function pour(fromIdx, toIdx) {
        if (fromIdx === toIdx) return;
        const fromVol = volumes[fromIdx];
        const toVol = volumes[toIdx];
        const space = CAPACITIES[toIdx] - toVol;
        if (space <= 0) return;
        const amount = Math.min(space, fromVol);
        if (amount === 0) return;

        if (isAnimating) {
            animationQueue.push({ fromIdx, toIdx, amount });
            return;
        }
        isAnimating = true;
        const startFrom = fromVol;
        const startTo = toVol;
        const startTime = performance.now();

        function step(time) {
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / ANIMATION_DURATION, 1);
            const eased = progress < 0.5
                ? 4 * progress * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 3) / 2;
            const currentAmount = amount * eased;
            volumes[fromIdx] = startFrom - currentAmount;
            volumes[toIdx] = startTo + currentAmount;
            drawAll();
            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                volumes[fromIdx] = startFrom - amount;
                volumes[toIdx] = startTo + amount;
                isAnimating = false;
                drawAll();
                // Check win condition after pour completes
                checkWin();
                if (animationQueue.length > 0) {
                    const next = animationQueue.shift();
                    pour(next.fromIdx, next.toIdx);
                }
            }
        }
        requestAnimationFrame(step);
    }

    // ─── CLICK HANDLER ──────────────────────────────────────────────
    function onContainerClick(index) {
        if (isAnimating) return;
        if (selectedIndex === null) {
            selectedIndex = index;
            drawAll();
        } else {
            const from = selectedIndex;
            const to = index;
            pour(from, to);
            selectedIndex = null;
            drawAll();
        }
    }

    // ─── RESET ──────────────────────────────────────────────────────
    function resetGame() {
        if (isAnimating) return;
        volumes = [...INITIAL_VOLUMES];
        selectedIndex = null;
        animationQueue = [];
        winTriggered = false;
        drawAll();
        debugEl.textContent = '— Breakroom Edition —';
    }

    // ─── WIRING ──────────────────────────────────────────────────────
    containerItems.forEach((item, idx) => {
        item.addEventListener('click', () => onContainerClick(idx));
    });

    document.getElementById('resetBtn').addEventListener('click', resetGame);

    // ─── INIT ─────────────────────────────────────────────────────────
    for (let i = 0; i < 3; i++) {
        loadContainer(i);
    }

    drawAll();

    window.addEventListener('resize', () => {
        drawAll();
    });

})();
</script>
</body>
</html>
