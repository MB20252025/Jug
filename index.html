<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jug · Clean Pour</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background: #2b2520;
            background-image: radial-gradient(circle at 20% 30%, #3f352e 5%, #1f1a15 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: rgba(30, 25, 20, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 40px 40px 30px 30px;
            padding: 25px 30px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #b48d64;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 700px;
            width: 100%;
        }
        h1 { font-weight: 400; color: #fad7a8; text-shadow: 0 2px 8px #2d1f13; font-size: 2rem; letter-spacing: 1px; margin-bottom: 6px; }
        .sub { color: #dbbc93; background: #1f1a15b8; padding: 4px 22px; border-radius: 40px; border: 1px solid #b48d64; font-size: 1rem; margin-bottom: 16px; }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 60vh;
            border-radius: 20px;
            background: #1e1813;
            box-shadow: inset 0 0 30px #0a0705, 0 8px 20px black;
            border: 2px solid #b48d64;
            touch-action: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 8px;
        }
        button {
            padding: 8px 28px;
            font-size: 1rem;
            font-weight: 600;
            background: #4f3a28;
            border: 2px solid #cbab82;
            color: #f7e9d3;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 3px 0 #2b1d12;
            letter-spacing: 0.5px;
            flex: 1 1 auto;
            min-width: 110px;
        }
        button:hover { background: #73583e; border-color: #f5cf9e; transform: translateY(-2px); box-shadow: 0 5px 0 #2b1d12; }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2b1d12; }
        button.ghost { background: transparent; opacity: 0.6; }
        .status { font-size: 1.1rem; background: #1f1a15b8; padding: 4px 24px; border-radius: 30px; border: 1px solid #b48d64; color: #f0dcc0; margin-top: 6px; }
        .note { font-style: italic; color: #cfa97c; font-size: 0.7rem; margin-top: 6px; opacity: 0.7; text-align: center; }
        @media (max-width: 480px) {
            .card { padding: 15px; }
            h1 { font-size: 1.6rem; }
            button { min-width: 80px; padding: 6px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>☕ The Coffee Jug</h1>
    <div class="sub">no shadow leaks · clean pour</div>

    <canvas id="jugCanvas"></canvas>

    <div class="controls">
        <button id="fillBtn">⬆ Fill</button>
        <button id="pourBtn">⬇ Pour</button>
        <button id="resetBtn">⟲ Reset</button>
        <button id="maskBtn" class="ghost">👁 Show Mask</button>
    </div>

    <div class="status" id="statusDisplay">Level: 0%</div>
    <div class="note" id="debugNote">loading image…</div>
</div>

<script>
(function() {
    // ─── CONFIG ──────────────────────────────────────────────────────
    const IMAGE_PATH = 'jug.png';
    const SPOUT_X = 0.08;
    const SPOUT_Y = 0.02;
    const ANIMATION_DURATION = 800;
    const MAX_LEVEL = 0.85;
    const ALPHA_THRESHOLD = 128;   // pixel counted as "opaque outline" above this
    const SEAL_RADIUS = 3;         // how many px of gap the mask will seal over
                                    // bump to 4-5 if you still see leaks; the mask
                                    // will just hug the outline slightly tighter

    // ─── DOM ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('jugCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('statusDisplay');
    const debugEl = document.getElementById('debugNote');
    const maskBtn = document.getElementById('maskBtn');

    // ─── STATE ──────────────────────────────────────────────────────
    let currentLevel = 0;
    let isAnimating = false;
    let isPouring = false;
    let img = null;
    let interiorMask = null;   // Uint8Array, 1 = "coffee can render here"
    let maskReady = false;
    let showingMask = false;

    // ─── MORPHOLOGY HELPERS ────────────────────────────────────────
    // Simple box dilation: output[p] = 1 if any pixel within `radius`
    // (chebyshev distance) of p is 1 in the input.
    function dilate(src, w, h, radius) {
        const out = new Uint8Array(w * h);
        // Two-pass (horizontal then vertical) box dilation — much faster
        // than a full 2D window scan, same result for a square structuring element.
        const tmp = new Uint8Array(w * h);
        for (let y = 0; y < h; y++) {
            const rowOff = y * w;
            for (let x = 0; x < w; x++) {
                let hit = 0;
                const xs = Math.max(0, x - radius);
                const xe = Math.min(w - 1, x + radius);
                for (let xx = xs; xx <= xe; xx++) {
                    if (src[rowOff + xx]) { hit = 1; break; }
                }
                tmp[rowOff + x] = hit;
            }
        }
        for (let x = 0; x < w; x++) {
            for (let y = 0; y < h; y++) {
                let hit = 0;
                const ys = Math.max(0, y - radius);
                const ye = Math.min(h - 1, y + radius);
                for (let yy = ys; yy <= ye; yy++) {
                    if (tmp[yy * w + x]) { hit = 1; break; }
                }
                out[y * w + x] = hit;
            }
        }
        return out;
    }

    function floodFillBlocked(blocked, w, h, seedX, seedY) {
        const mask = new Uint8Array(w * h);
        const visited = new Uint8Array(w * h);
        const startIdx = seedY * w + seedX;
        if (blocked[startIdx]) return mask; // bad seed, caller should re-pick
        const stack = [seedX, seedY];
        visited[startIdx] = 1;
        while (stack.length) {
            const cy = stack.pop();
            const cx = stack.pop();
            const idx = cy * w + cx;
            mask[idx] = 1;
            const neighbors = [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
            for (const [nx, ny] of neighbors) {
                if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
                const nIdx = ny * w + nx;
                if (visited[nIdx] || blocked[nIdx]) continue;
                visited[nIdx] = 1;
                stack.push(nx, ny);
            }
        }
        return mask;
    }

    function findSeed(opaque, w, h) {
        // search outward from center for a transparent (interior) pixel
        const cx0 = Math.floor(w / 2), cy0 = Math.floor(h / 2);
        if (!opaque[cy0 * w + cx0]) return [cx0, cy0];
        const maxR = Math.floor(Math.min(w, h) * 0.45);
        for (let r = 2; r < maxR; r += 2) {
            for (let a = 0; a < Math.PI * 2; a += 0.15) {
                const px = Math.round(cx0 + r * Math.cos(a));
                const py = Math.round(cy0 + r * Math.sin(a));
                if (px < 0 || px >= w || py < 0 || py >= h) continue;
                if (!opaque[py * w + px]) return [px, py];
            }
        }
        return [cx0, cy0];
    }

    // ─── BUILD MASK (gap-sealed flood fill) ───────────────────────────
    // 1. opaque[]  = pixels that are part of the drawn outline (alpha >= threshold)
    // 2. sealed[]  = opaque dilated by SEAL_RADIUS -> closes small 1-3px gaps
    //                so the fill can't leak through a thin break in the line
    // 3. core[]    = flood fill of the transparent area, blocked by sealed[]
    // 4. mask[]    = core dilated back by SEAL_RADIUS, then intersected with
    //                the ORIGINAL transparent pixels -> restores the interior
    //                to its true size without ever crossing outside the outline
    function computeInteriorMask(imageData, w, h) {
        const data = imageData.data;
        const opaque = new Uint8Array(w * h);
        const transparent = new Uint8Array(w * h);
        for (let i = 0; i < w * h; i++) {
            const a = data[i * 4 + 3];
            opaque[i] = a >= ALPHA_THRESHOLD ? 1 : 0;
            transparent[i] = 1 - opaque[i];
        }

        const sealed = dilate(opaque, w, h, SEAL_RADIUS);
        let [seedX, seedY] = findSeed(sealed, w, h);

        let core = floodFillBlocked(sealed, w, h, seedX, seedY);
        let corePixels = core.reduce((a, b) => a + b, 0);

        // Safety net: if the sealed seed still landed on a blocked pixel
        // (unlikely) or the fill found almost nothing, fall back to the
        // raw (unsealed) opacity map so the jug still renders something.
        if (corePixels < 20) {
            debugEl.textContent = '⚠️ Seal too aggressive at r=' + SEAL_RADIUS + ', falling back.';
            [seedX, seedY] = findSeed(opaque, w, h);
            core = floodFillBlocked(opaque, w, h, seedX, seedY);
            corePixels = core.reduce((a, b) => a + b, 0);
        }

        const restored = dilate(core, w, h, SEAL_RADIUS);
        const mask = new Uint8Array(w * h);
        for (let i = 0; i < w * h; i++) {
            mask[i] = (restored[i] && transparent[i]) ? 1 : 0;
        }

        const finalCount = mask.reduce((a, b) => a + b, 0);
        debugEl.textContent = `✅ Mask ready (${finalCount} px, seal r=${SEAL_RADIUS})`;
        return mask;
    }

    // ─── LOAD ────────────────────────────────────────────────────────
    function initCanvas() {
        img = new Image();
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            canvas.style.aspectRatio = img.width / img.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            interiorMask = computeInteriorMask(imageData, canvas.width, canvas.height);
            maskReady = true;

            currentLevel = 0;
            isPouring = false;
            drawScene();
        };
        img.onerror = function() {
            debugEl.textContent = '❌ Failed to load "' + IMAGE_PATH + '". Place jug.png next to this HTML file.';
            console.error('Image not found:', IMAGE_PATH);
        };
        img.src = IMAGE_PATH;
    }

    // ─── DRAW ─────────────────────────────────────────────────────────
    function drawScene(level = currentLevel, pouring = isPouring) {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        if (!img || !maskReady) return;

        if (showingMask) {
            drawMaskOverlay(w, h);
            return;
        }

        // 1. Draw jug
        ctx.drawImage(img, 0, 0, w, h);

        const liquidHeight = level * h;
        if (liquidHeight > 0) {
            // Coffee
            const grad = ctx.createLinearGradient(0, h - liquidHeight, 0, h);
            grad.addColorStop(0, '#8b5d37');
            grad.addColorStop(0.4, '#6b3e1f');
            grad.addColorStop(0.8, '#4d2c15');
            grad.addColorStop(1, '#2f1a0c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, h - liquidHeight, w, liquidHeight);

            // Highlight
            const highlightY = h - liquidHeight;
            ctx.beginPath();
            ctx.ellipse(w * 0.3, highlightY + 2, w * 0.25, 4, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 220, 170, 0.3)';
            ctx.fill();

            // Apply mask — coffee can ONLY show where interiorMask says "inside"
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const px = (i / 4) % w;
                const py = Math.floor((i / 4) / w);
                const maskIdx = py * w + px;
                if (interiorMask[maskIdx] === 0) {
                    data[i + 3] = 0;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // 2. Redraw jug on top (restores outline / handle / spout)
        ctx.drawImage(img, 0, 0, w, h);

        // 3. Pouring stream (clipped to mask bounding box logic isn't needed —
        //    the stream is drawn as a shape, not filled via mask, so it never
        //    reads interiorMask; it's positioned purely from SPOUT_X/SPOUT_Y)
        if (pouring && level > 0.02) {
            drawStream(w, h, level);
        }

        const percent = Math.round((level / MAX_LEVEL) * 100);
        statusEl.textContent = `Level: ${Math.min(percent, 100)}%`;
    }

    function drawMaskOverlay(w, h) {
        ctx.drawImage(img, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < interiorMask.length; i++) {
            if (interiorMask[i]) {
                d[i*4] = 255;
                d[i*4+1] = 0;
                d[i*4+2] = 200;
                d[i*4+3] = 160;
            }
        }
        ctx.putImageData(imgData, 0, 0);
        statusEl.textContent = 'Mask preview — magenta = fillable area';
    }

    // ─── STREAM ────────────────────────────────────────────────────
    function drawStream(w, h, level) {
        const sx = SPOUT_X * w;
        const sy = SPOUT_Y * h;
        const baseLength = Math.min(level / MAX_LEVEL, 1) * h * 0.7 + 30;
        const time = Date.now() / 300;

        ctx.save();
        ctx.shadowBlur = 0;

        const topWidth = 8 + Math.sin(time * 1.3) * 1.5;
        const bottomWidth = 3 + Math.sin(time * 1.7 + 1) * 1.2;
        const wiggle = Math.sin(time * 2.1) * 4;

        ctx.beginPath();
        ctx.moveTo(sx - topWidth/2 + wiggle*0.3, sy + 4);
        ctx.quadraticCurveTo(
            sx + wiggle*0.6,
            sy + baseLength*0.4,
            sx - bottomWidth/2 + wiggle*0.8,
            sy + baseLength
        );
        ctx.quadraticCurveTo(
            sx + wiggle*0.3 + 2,
            sy + baseLength*0.6,
            sx + topWidth/2 + wiggle*0.4,
            sy + 4
        );
        ctx.closePath();

        const grad = ctx.createLinearGradient(sx, sy, sx + wiggle, sy + baseLength);
        grad.addColorStop(0, '#a06b42');
        grad.addColorStop(0.5, '#6b3e1f');
        grad.addColorStop(1, '#3d2413');
        ctx.fillStyle = grad;
        ctx.fill();

        for (let i = 0; i < 6; i++) {
            const dx = (i - 2.5) * 5 + Math.sin(time * 2.7 + i) * 3;
            const dy = Math.sin(time * 3.1 + i * 0.7) * 2;
            const radius = 2 + Math.sin(time * 2.3 + i * 1.1) * 1.2 + 1.5;
            ctx.beginPath();
            ctx.arc(
                sx + wiggle*0.6 + dx,
                sy + baseLength + 6 + dy + i*2,
                Math.max(radius, 1),
                0, Math.PI * 2
            );
            ctx.fillStyle = `rgba(100, 60, 35, ${0.5 + Math.sin(time + i) * 0.2})`;
            ctx.fill();
        }

        ctx.restore();
    }

    // ─── ANIMATION ──────────────────────────────────────────────────
    function animateTo(target, callback) {
        if (isAnimating) return;
        const start = currentLevel;
        const end = Math.min(Math.max(target, 0), MAX_LEVEL);
        if (Math.abs(start - end) < 0.001) {
            currentLevel = end;
            drawScene();
            if (callback) callback();
            return;
        }

        isAnimating = true;
        const startTime = performance.now();

        function step(time) {
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / ANIMATION_DURATION, 1);
            const eased = progress < 0.5
                ? 4 * progress * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 3) / 2;
            currentLevel = start + (end - start) * eased;
            drawScene(currentLevel, isPouring);

            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                currentLevel = end;
                isAnimating = false;
                drawScene(currentLevel, isPouring);
                if (callback) callback();
            }
        }
        requestAnimationFrame(step);
    }

    // ─── ACTIONS ────────────────────────────────────────────────────
    function fillCoffee() {
        if (isAnimating || showingMask || currentLevel >= MAX_LEVEL - 0.01) return;
        isPouring = false;
        animateTo(MAX_LEVEL);
    }

    function pourCoffee() {
        if (isAnimating || showingMask || currentLevel < 0.02) return;
        isPouring = true;
        animateTo(0, function() {
            isPouring = false;
            drawScene(0, false);
        });
    }

    function resetJug() {
        if (isAnimating) return;
        isPouring = false;
        currentLevel = 0;
        drawScene(0, false);
    }

    function toggleMask() {
        showingMask = !showingMask;
        maskBtn.textContent = showingMask ? '👁 Hide Mask' : '👁 Show Mask';
        drawScene(currentLevel, isPouring);
    }

    // ─── WIRING ──────────────────────────────────────────────────────
    document.getElementById('fillBtn').addEventListener('click', fillCoffee);
    document.getElementById('pourBtn').addEventListener('click', pourCoffee);
    document.getElementById('resetBtn').addEventListener('click', resetJug);
    maskBtn.addEventListener('click', toggleMask);

    window.addEventListener('resize', function() {
        if (maskReady && !isAnimating) drawScene(currentLevel, isPouring);
    });

    initCanvas();
})();
</script>
</body>
</html>
